name: Report a problem
description: Something in DuoDuo isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Issues are public. Please don't include personal details.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone Duo, iOS 27.1
    validations:
      required: true
  - type: input
    id: level
    attributes:
      label: Chapter and level
      description: Shown at the top of the screen
      placeholder: Crease · 2
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A level or puzzle
        - Folding / the hinge
        - Hints or walkthrough
        - Purchases / restore
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots help.
